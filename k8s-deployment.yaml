apiVersion: apps/v1
kind: Deployment
metadata:
  name: temp-converter-deployment
  labels:
    app: temp-converter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temp-converter
  template:
    metadata:
      labels:
        app: temp-converter
    spec:
      containers:
      - name: temp-converter
        image: AppanaboinaRamu/temp-converter:REPLACE_WITH_SHA
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: temp-converter-service
spec:
  type: ClusterIP
  selector:
    app: temp-converter
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
